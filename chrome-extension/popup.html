<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph RAG Email Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 350px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            font-size: 18px;
            margin-bottom: 5px;
            color: #667eea;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .subtitle {
            font-size: 12px;
            color: #666;
            margin-bottom: 20px;
        }
        
        .status {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        
        .status.online {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .status.offline {
            background: #ffebee;
            color: #c62828;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        .status.online .status-dot {
            background: #4caf50;
        }
        
        .status.offline .status-dot {
            background: #f44336;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .setting {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 5px;
            color: #555;
        }
        
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(102, 126, 234, 0.3);
        }
        
        .btn-secondary {
            background: #f5f5f5;
            color: #666;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .info {
            margin-top: 15px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 6px;
            font-size: 12px;
            color: #666;
        }
        
        .info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        
        .info-item:last-child {
            margin-bottom: 0;
        }
        
        .info-label {
            font-weight: 500;
        }
        
        .message {
            margin-top: 10px;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            text-align: center;
            display: none;
        }
        
        .message.success {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .message.error {
            background: #ffebee;
            color: #c62828;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Graph RAG Assistant</h1>
        <p class="subtitle">AI-powered email reply generation</p>
        
        <div id="status" class="status offline">
            <div class="status-dot"></div>
            <span id="statusText">Checking backend...</span>
        </div>
        
        <div class="setting">
            <label for="apiUrl">Backend API URL</label>
            <input type="text" id="apiUrl" placeholder="http://localhost:8000/api">
        </div>
        
        <div class="setting">
            <label for="confidenceThreshold">Confidence Threshold</label>
            <input type="number" id="confidenceThreshold" min="0" max="1" step="0.05" value="0.85">
        </div>
        
        <div class="setting">
            <div class="checkbox-container">
                <input type="checkbox" id="autoInsert" checked>
                <label for="autoInsert" style="margin: 0;">Auto-insert drafts</label>
            </div>
        </div>
        
        <div class="buttons">
            <button class="btn-primary" id="saveBtn">Save Settings</button>
            <button class="btn-secondary" id="testBtn">Test Connection</button>
        </div>
        
        <div id="message" class="message"></div>
        
        <div class="info">
            <div class="info-item">
                <span class="info-label">Version:</span>
                <span>1.0.0</span>
            </div>
            <div class="info-item">
                <span class="info-label">Model:</span>
                <span>Llama 3 (Ollama)</span>
            </div>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
