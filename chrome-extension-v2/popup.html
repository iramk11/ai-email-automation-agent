<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Email Assistant</title>
    <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" fill="currentColor"/>
                    </svg>
                    <span class="logo-text">AI Email</span>
                </div>
                <div class="status-indicator" id="statusIndicator">
                    <span class="status-dot" id="statusDot"></span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Status Card -->
            <div class="card status-card" id="statusCard">
                <div class="status-content">
                    <div class="status-icon" id="statusIcon">⚡</div>
                    <div class="status-info">
                        <div class="status-label" id="statusLabel">Checking connection...</div>
                        <div class="status-subtitle" id="statusSubtitle">Backend status</div>
                    </div>
                </div>
            </div>

            <!-- Settings Section -->
            <div class="settings-section">
                <h3 class="section-title">Settings</h3>
                
                <div class="form-group">
                    <label for="apiUrl" class="form-label">
                        <svg class="label-icon" viewBox="0 0 24 24" fill="none">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" fill="currentColor"/>
                        </svg>
                        API URL
                    </label>
                    <input type="text" id="apiUrl" class="form-input" placeholder="http://localhost:8001/api">
                </div>

                <div class="form-group">
                    <label for="confidenceThreshold" class="form-label">
                        <svg class="label-icon" viewBox="0 0 24 24" fill="none">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.39-2.1 1.39-1.6 0-2.23-.72-2.32-1.64H8.04c.1 1.7 1.36 2.66 2.86 2.97V19h2.34v-1.67c1.52-.29 2.72-1.16 2.73-2.77-.01-2.2-1.9-2.96-3.66-3.42z" fill="currentColor"/>
                        </svg>
                        Confidence Threshold
                    </label>
                    <div class="slider-container">
                        <input type="range" id="confidenceThreshold" class="slider" min="0" max="1" step="0.05" value="0.85">
                        <span class="slider-value" id="confidenceValue">85%</span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="autoInsert" class="checkbox" checked>
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-text">Auto-insert drafts</span>
                    </label>
                </div>
            </div>

            <!-- Actions -->
            <div class="actions-section">
                <button class="btn btn-primary" id="testBtn">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none">
                        <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z" fill="currentColor"/>
                    </svg>
                    Test Connection
                </button>
                <button class="btn btn-secondary" id="saveBtn">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none">
                        <path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z" fill="currentColor"/>
                    </svg>
                    Save Settings
                </button>
            </div>

            <!-- Info Footer -->
            <div class="info-footer">
                <div class="info-item">
                    <span class="info-label">Version</span>
                    <span class="info-value">2.0.0</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Provider</span>
                    <span class="info-value">Ollama</span>
                </div>
            </div>
        </main>

        <!-- Toast Notification -->
        <div class="toast" id="toast"></div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
